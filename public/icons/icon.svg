<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00351b"/>
      <stop offset="100%" stop-color="#154d2e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb59a"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0f399"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#85bd95" stroke-width="4" opacity="0.3"/>
  
  <!-- Stylized Fruit & Leaf Icon -->
  <g transform="translate(256, 210)">
    <!-- Fruit Base (Mango / Apple silhouette) -->
    <path d="M-60,70 C-110,30 -110,-40 -60,-80 C-20,-110 50,-100 80,-60 C110,-20 100,50 60,80 C10,110 -20,100 -60,70 Z" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- Fresh Leaf -->
    <path d="M-10,-100 C-20,-150 40,-170 80,-140 C80,-100 40,-80 -10,-100 Z" fill="url(#leafGrad)"/>
    
    <!-- Droplet / Blessing sparkle -->
    <circle cx="-30" cy="-20" r="14" fill="#ffffff" opacity="0.8"/>
    <circle cx="20" cy="20" r="8" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- Bengali Typography Title -->
  <text x="256" y="380" font-family="'Noto Sans Bengali', 'Hind Siliguri', sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">মায়ের দোয়া</text>
  <text x="256" y="435" font-family="'Noto Sans Bengali', 'Hind Siliguri', sans-serif" font-size="34" font-weight="600" fill="#a0f399" text-anchor="middle">তাজা ফল</text>
</svg>
